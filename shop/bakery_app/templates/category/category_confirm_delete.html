{% extends "base.html" %}

{% block title_name %}
Удаление категории
{% endblock %}

{% block content %}
<h1>Удалить «{{ category.name }}»?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn">Удалить</button>
    </form>
    <a href="{% url 'category_list' %}" class="link-back">← Отмена</a>
{% endblock %}
