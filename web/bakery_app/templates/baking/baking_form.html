{% extends "base.html" %}

{% block title_name %}
Выпечка — форма
{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Редактировать{% else %}Добавить{% endif %} выпечку</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Сохранить</button>
    </form>
    <a href="{% url 'baking_list' %}" class="link-back">← К списку выпечки</a>
{% endblock %}
