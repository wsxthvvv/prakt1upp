{% extends "base.html" %}

{% block title_name %}
Отзыв — форма
{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Редактировать{% else %}Добавить{% endif %} отзыв</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Сохранить</button>
    </form>
    <a href="{% url 'review_list' %}" class="link-back">← К списку отзывов</a>
{% endblock %}
